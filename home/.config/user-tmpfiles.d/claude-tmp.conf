# /tmp is tmpfs (RAM): Claude Code session dirs piled up to 5.7 GB over 5 days of uptime.
# Age out anything untouched for 3 days (systemd-tmpfiles-clean.timer, user instance, daily).
e /tmp/claude-1000 - - - 3d
# headless Chrome profile used by screenshot runs: 1,836 leftover scoped_dir* = 12 GB by 2026-10-26
e %h/.cache/google-chrome-headless - - - 3d
