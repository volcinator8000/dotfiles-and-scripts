
# ── appended by the cybersigil dotfiles: manual boot stanza for refind-btrfs ──────────────
# refind-btrfs only works from a manual stanza (it needs root= and rootflags=subvol= to rewrite
# per snapshot). The auto-detected cachyos entry is hidden to avoid a duplicate; the plain
# "linux" kernel stays auto-detected as a fallback.
dont_scan_files vmlinuz-linux-cachyos
default_selection "Arch Linux (CachyOS)"

menuentry "Arch Linux (CachyOS)" {
    icon     /EFI/refind/icons/os_arch.png
    volume   a41db11a-5ee0-4f73-9c64-8e94aae9e297
    loader   /vmlinuz-linux-cachyos
    initrd   /amd-ucode.img
    options  "root=PARTUUID=e7e4e3d4-32f9-4c6c-a599-c55a576bff48 rootflags=subvol=@ rw rootfstype=btrfs resume=PARTUUID=e7e4e3d4-32f9-4c6c-a599-c55a576bff48 resume_offset=3155200 initrd=\initramfs-linux-cachyos.img"
}
