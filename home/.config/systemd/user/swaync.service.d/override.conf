# swaync is started by hyprland.lua via `systemctl --user start swaync` (same unit that
# D-Bus activation of org.freedesktop.Notifications targets, so the two never race).
# The user manager does not carry Hyprland's hl.env values, so repeat the GTK ones here.
[Service]
Environment=GDK_DISABLE=vulkan
Environment=GTK_A11Y=none
Environment=NO_AT_BRIDGE=1
