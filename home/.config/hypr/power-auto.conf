# automatic power profile + eco mode on charger events (read by waybar/scripts/battery.sh every 10 s; edit in the settings app)
# eco_effects=true: blur/shadows off on battery (iGPU work); eco_brightness=N: cap the backlight at N% when unplugging (0 = off)
enabled=true
on_battery=power-saver
on_ac=balanced
eco_effects=true
eco_brightness=60
# ultra power saver mode (~/.local/bin/ultra; settings app > Power > Ultra power saver)
ultra_exit_on_ac=true
ultra_at_pct=0
ultra_brightness=30
ultra_refresh=true
ultra_max_mhz=2400
ultra_abm=3
ultra_bluetooth_off=true
ultra_quit_apps=vesktop slack spotify
