# A short press of the power button used to power off immediately, including the press
# that wakes the laptop from suspend (2026-09-08 14:17: "Power key pressed short" 2 s after
# "Lid opened", clean shutdown). Short press -> handed to the compositor (wlogout menu),
# long press (~5 s) -> power off, hold longer -> firmware kills it anyway.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
