# cybersigilism hyprlock
$base    = rgb(050507)
$surface = rgb(0d0d12)
$line    = rgb(1b1b24)
$text    = rgb(dcdce3)
$muted   = rgb(6b6b78)
$accent  = rgb(3ae0ff)
$red     = rgb(ff2d3a)
$amber   = rgb(ffb000)
$font    = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = /home/kali/Pictures/Wallpapers/miku.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.02
    brightness = 0.45
    color = $base
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 92
    font_family = $font ExtraLight
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %d %b")" | tr a-z A-Z
    color = $accent
    font_size = 16
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##6b6b78">&gt; AUTHENTICATE_</span>
    check_color = $amber
    fail_color = $red
    fail_text = <span foreground="##ff2d3a">ACCESS DENIED · $ATTEMPTS</span>
    hide_input = false
    rounding = 0
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[] echo "$(uname -n) // $USER" | tr a-z A-Z
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}

# ── now playing (spotify) : bottom-left, blank when nothing plays ──
image {
    monitor =
    path = /home/kali/.config/hypr/scripts/noart.png
    size = 90
    rounding = 0
    border_size = 1
    border_color = $accent
    reload_time = 3
    reload_cmd = ~/.config/hypr/scripts/nowplaying-art.sh
    position = 40, 40
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/nowplaying-text.sh title
    color = $text
    font_size = 14
    font_family = $font
    position = 150, 90
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/nowplaying-text.sh artist
    color = $accent
    font_size = 11
    font_family = $font
    position = 150, 62
    halign = left
    valign = bottom
}

# ── status: battery + network top-right, time away under the host line ──
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-info.sh batt
    color = $muted
    font_size = 11
    font_family = $font
    position = -30, -24
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh away
    color = $accent
    font_size = 10
    font_family = $font
    position = 0, -146
    halign = center
    valign = center
}
