"$schema" = 'https://starship.rs/config-schema.json'

# ── cybersigilism prompt ─────────────────────────────────────────
# line 1: ┌ dir  git  langs  (right: time)
# line 2: └ ❯   — the ❯ is the input marker, always visible
add_newline = true
palette = "cybersigil"

format = """
[┌](fg:muted) $directory$git_branch$git_status$git_state$python$nodejs$rust$c$docker_context$cmd_duration
[└](fg:muted) $character"""
right_format = "$time"

[palettes.cybersigil]
blue   = "#3ae0ff"
purple = "#a64dff"
pink   = "#ff5cc8"
red    = "#ff2d3a"
green  = "#39ff14"
amber  = "#ffb000"
orange = "#ff5a1f"
text   = "#dcdce3"
muted  = "#6b6b78"
line   = "#2a2a36"

[character]
success_symbol = "[❯](bold blue)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold purple)"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "amber"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "pink"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!"
staged = "+"
untracked = "?"
stashed = "≡"

[git_state]
style = "amber"

[cmd_duration]
min_time = 2000
style = "muted"
format = "[󱎫 $duration]($style) "

[time]
disabled = false
style = "muted"
format = "[$time]($style)"
time_format = "%H:%M"

[python]
symbol = " "
style = "amber"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"
[rust]
symbol = "󱘗 "
style = "orange"
format = "[$symbol($version )]($style)"
[c]
symbol = " "
style = "blue"
format = "[$symbol($version )]($style)"
[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

