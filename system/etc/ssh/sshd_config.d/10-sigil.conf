# SSH server hardening for the laptop (remote control from phone / other devices on the LAN).
# Bootstrap: password login is allowed so a new device can be set up; once its key is in
# ~/.ssh/authorized_keys, flip PasswordAuthentication to "no" and reload sshd.
AllowUsers kali
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 3
X11Forwarding no
AllowAgentForwarding no
PrintMotd no
