general {
    # plain hyprlock: a stale/hung hyprlock must not block re-locking
    lock_cmd = /home/kali/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    inhibit_sleep = 3   # delay suspend until the lock screen is drawn
}

# generated by sigil-settings; edit there or by hand (timeouts in seconds)

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 25%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 450
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 600
    on-timeout = systemctl suspend   # was suspend-then-hibernate: the 2 h suspend->hibernate handoff on 2026-09-07 21:00 left no image and a dead boot
}
