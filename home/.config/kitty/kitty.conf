# ── Font ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures never

# ── Window ───────────────────────────────────────────
window_padding_width 10
background_opacity   0.88
confirm_os_window_close 0
enable_audio_bell no
cursor_shape underline
cursor_blink_interval 0.5
scrollback_lines 10000
copy_on_select yes
mouse_hide_wait 2.0

# ── Tabs ─────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style separator
tab_separator " │ "

# ── Cybersigilism ────────────────────────────────────
foreground              #dcdce3
background              #050507
selection_foreground    #050507
selection_background    #3ae0ff
cursor                  #3ae0ff
cursor_text_color       #050507
url_color               #a64dff
active_border_color     #3ae0ff
inactive_border_color   #1b1b24
bell_border_color       #ffb000
wayland_titlebar_color  #050507
active_tab_foreground   #050507
active_tab_background   #3ae0ff
inactive_tab_foreground #6b6b78
inactive_tab_background #0d0d12
tab_bar_background      #050507
mark1_foreground #050507
mark1_background #3ae0ff
mark2_foreground #050507
mark2_background #a64dff
mark3_foreground #050507
mark3_background #ff5cc8
# black / bright black
color0  #1b1b24
color8  #6b6b78
# red  (communication red)
color1  #ff2d3a
color9  #ff5a63
# green (graphical wavelength)
color2  #39ff14
color10 #7dff66
# yellow (phosphorus amber)
color3  #ffb000
color11 #ffc94d
# blue (cherenkov glow)
color4  #3ae0ff
color12 #7eebff
# magenta (plasmatic purple)
color5  #a64dff
color13 #c084ff
# cyan (snooze pink used as the odd one out)
color6  #ff5cc8
color14 #ff8fd9
# white / bright white
color7  #dcdce3
color15 #ffffff

# ── Emoji / CJK fallbacks (needs noto-fonts-emoji + noto-fonts-cjk) ──
symbol_map U+1F300-U+1F5FF,U+1F600-U+1F64F,U+1F680-U+1F6FF,U+1F900-U+1F9FF,U+1FA70-U+1FAFF,U+2600-U+26FF,U+2700-U+27BF Noto Color Emoji
