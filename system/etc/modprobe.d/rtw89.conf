# RTL8852BE (rtw89) on the HP Victus: 2026-09-22 the card's firmware crashed at boot ("SER catches error")
# and four of five "data fabric sync flood" resets coincided with a Wi-Fi/Bluetooth state change.
# These are the standard rtw89 stability knobs for AMD platforms: no PCIe L1/L1ss/CLKREQ games on the
# link to this card. Costs a little idle power on the wifi card only. Applies at module load (reboot).
options rtw89_pci disable_aspm_l1=1 disable_aspm_l1ss=1 disable_clkreq=1
